[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-novelty-scada"
version = "0.1.0"
description = "The fruit fly's mushroom body novelty detector (FlyHash + fly Bloom filter) on wind turbine SCADA: early fault detection on the CARE to Compare benchmark, real FlyWire PN->KC wiring vs random, streaming operation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "threadpoolctl>=3",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fly-novelty = "fly_novelty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fly_novelty = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
